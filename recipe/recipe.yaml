schema_version: 1

context:
  version: "1.0.2"

package:
  name: pystac-ext-scientific
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-scientific/pystac_ext_scientific-${{ version }}.tar.gz
  sha256: 0a2a8d1c36c7d3453cd79ce2a3f40a0084167d918e4ca8ee95bf219c38a5414a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.scientific
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Scientific extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-scientific/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
